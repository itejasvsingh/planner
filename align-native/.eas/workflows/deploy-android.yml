# On every push to main: if native code changed (new fingerprint), build a new preview APK;
# otherwise send an over-the-air update that installed APKs pick up on next launch.
# Lives in align-native/.eas because Expo reads workflows relative to the project's GitHub base directory,
# which must be set to "align-native" (expo.dev > @itejasv/align-native > GitHub). With the repo root as base
# directory the jobs run in the Next.js app and fail with "EAS project not configured".
name: Deploy Android (APK or OTA update)

on:
  push:
    branches: ['main']

# Pin the SDK 57 image: when Expo can't detect the SDK it falls back to an old Node 18 image.
defaults:
  image: sdk-57

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: preview

  get_android_build:
    name: Check for an APK with this fingerprint
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: preview
      platform: android

  build_android:
    name: Build new APK (native code changed)
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: preview

  publish_android_update:
    name: Publish OTA update
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    # Same EAS environment the APK is built with; the update job otherwise defaults to "production",
    # which doesn't hold EXPO_PUBLIC_API_URL, and AI quick-add / SMS import would break on the phone.
    environment: preview
    params:
      branch: preview
      platform: android
      message: ${{ github.commit_message }}
