<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  body { margin: 0; padding: 0; background: red; height: 100vh; }
  .box { background: blue; position: absolute; bottom: 0; left: 0; right: 0; height: 100px; }
  .out { position: absolute; top: 100px; color: white; font-size: 20px; }
</style>
</head>
<body>
  <div class="box"></div>
  <div class="out" id="out">Measuring...</div>
  <script>
    setTimeout(() => {
      document.getElementById('out').innerText = `innerHeight: ${window.innerHeight}, visualViewport: ${window.visualViewport ? window.visualViewport.height : 'N/A'}`;
    }, 1000);
  </script>
</body>
</html>
