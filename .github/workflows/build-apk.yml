name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Planner Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyDSIN2F2sDc-vB_S7ITCMnKILbr9l-r6co"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "planner-app-3471f.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "planner-app-3471f"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "planner-app-3471f.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "817744322906"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:817744322906:web:35d264cd7079a211749363"
          FIREBASE_PROJECT_ID: "planner-app-3471f"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Output File
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Planner.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Planner-Android-APK
          path: release-output/Planner.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Planner Android App (Latest APK)"
          body: |
            ### 📱 Planner Android Application
            
            Install this APK on your Android device to run Planner with full offline support, optimistic updates, and native haptics.
            
            #### 🚀 How to Install:
            1. Download `Planner.apk` below directly onto your Android device.
            2. Tap the file to install (select **Allow from this source** if prompted).
            3. Open **Planner** and start using your agenda & finances!
          files: release-output/Planner.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
